*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--fs))}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg);overflow-x:hidden;transition:background .3s,color .3s}
body.noanim *{animation:none!important;transition:none!important}
body.noblur .card,body.noblur .modal,body.noblur .set-wrap{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

/* ---------- Fond ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:calc(var(--bgi)*.65);animation:float 14s ease-in-out infinite}
.bg i:nth-child(1){width:320px;height:320px;background:var(--acc);left:-90px;top:15%}
.bg i:nth-child(2){width:280px;height:280px;background:var(--acc2);right:-70px;top:55%;animation-delay:-5s}
.bg i:nth-child(3){width:220px;height:220px;background:var(--acc);left:45%;top:-70px;animation-delay:-9s;opacity:calc(var(--bgi)*.35)}
@keyframes float{50%{transform:translate(30px,-40px) scale(1.15)}}
.bg.grid::before{content:"";position:absolute;inset:0;opacity:var(--bgi);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:38px 38px;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 15%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 25%,#000 15%,transparent 75%)}
.bg.grid::after{content:"";position:absolute;width:500px;height:500px;left:50%;top:-180px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(var(--acc-rgb),.5),transparent 70%);opacity:var(--bgi)}
.bg.gradient::before{content:"";position:absolute;inset:0;opacity:var(--bgi);background:linear-gradient(160deg,rgba(var(--acc-rgb),.6),transparent 45%,rgba(var(--acc2-rgb),.5))}
.bg.stars s{position:absolute;border-radius:50%;background:var(--txt);opacity:var(--o);animation:tw var(--d) ease-in-out infinite;transform:scale(var(--bgi))}
@keyframes tw{50%{opacity:.08}}

/* ---------- Base ---------- */
#app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 0;min-height:100vh;display:flex;flex-direction:column}
.screen{animation:in .35s ease both;display:flex;flex-direction:column;gap:12px;flex:1}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2,h3,h4,p{margin:0}
b{font-weight:700}
.mut{color:var(--mut)}.small{font-size:.8rem}.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;color:#fff;padding:calc(var(--pad) - 1px) 20px;border-radius:calc(var(--r) * .8);
  background:linear-gradient(135deg,var(--acc),rgba(var(--acc-rgb),.7) 40%,var(--acc2));background-size:140% 140%;box-shadow:0 8px 26px rgba(var(--acc-rgb),.38);transition:transform .12s,filter .15s,opacity .15s;width:100%;font-size:1.05rem;letter-spacing:.2px}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line);color:var(--txt)}
.btn.danger{background:linear-gradient(135deg,#ff5468,#ff8a4f);box-shadow:0 8px 24px rgba(255,84,104,.3)}
.btn.good{background:linear-gradient(135deg,#1fcf88,#2ee5c8);color:#032;box-shadow:0 8px 24px rgba(46,229,157,.3)}
.btn.sm{padding:9px 14px;font-size:.85rem;width:auto;border-radius:12px}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.iconbtn{width:42px;height:42px;flex:none;border-radius:calc(var(--r)*.65);border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;display:grid;place-items:center;font:inherit;font-weight:800;transition:.12s}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px}
.top .tt{font-weight:800;font-size:1.05rem;text-align:center;flex:1}
.top .sp{width:42px}
.dock{position:sticky;bottom:0;margin:auto -16px 0;padding:14px 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:linear-gradient(to top,var(--bg) 55%,transparent);z-index:5}
input[type=text],textarea{width:100%;font:inherit;font-size:1rem;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:calc(var(--r)*.65);padding:12px 14px;outline:none;transition:border .2s,box-shadow .2s}
textarea{resize:vertical;min-height:90px;font-size:.85rem;font-family:ui-monospace,Menlo,monospace}
input[type=text]:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.25)}
.pill{padding:5px 11px;border-radius:30px;font-size:.78rem;font-weight:800;white-space:nowrap}
.pill.c{background:rgba(var(--cc-rgb),.16);color:var(--cc)}
.pill.u{background:rgba(var(--cu-rgb),.16);color:var(--cu)}
.pill.w{background:rgba(var(--cw-rgb),.16);color:var(--cw)}
.pill.n{background:var(--card2);color:var(--mut)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hint{font-size:.8rem;color:var(--mut);text-align:center}
.big{font-size:clamp(1.7rem,8vw,2.4rem);font-weight:900;letter-spacing:-1px;line-height:1.05}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:1;text-align:center;padding:6px 0}
.progress{height:6px;border-radius:6px;background:var(--card2);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}

/* ---------- Avatars ---------- */
.av{display:inline-grid;place-items:center;width:40px;height:40px;flex:none;border-radius:34%;background:var(--card2);font-size:1.4rem;line-height:1;overflow:hidden}
.av b{color:#fff;font-weight:900}
.av.xl{width:104px;height:104px;font-size:3.4rem;border-radius:32%;box-shadow:0 14px 44px rgba(var(--acc-rgb),.45);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.av.lg{width:56px;height:56px;font-size:1.9rem}
.av.sm{width:30px;height:30px;font-size:1.05rem;border-radius:32%}
@keyframes pop{from{transform:scale(.3) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}

/* ---------- Accueil ---------- */
.logo{font-size:clamp(2.8rem,15vw,4.6rem);font-weight:900;letter-spacing:-3px;line-height:.9;text-align:center;
  background:linear-gradient(120deg,var(--txt) 10%,var(--acc) 55%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 30px rgba(var(--acc-rgb),.45))}
.eye{font-size:4.2rem;animation:pop .8s both,bob 4s ease-in-out infinite 1s}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu .btn{display:flex;flex-direction:column;gap:4px;align-items:center;padding:14px 6px;font-size:.8rem}
.menu .btn span{font-size:1.4rem}

/* ---------- Setup ---------- */
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;gap:8px;align-items:center;animation:in .25s both}
.pitem .av{width:46px;height:46px;font-size:1.5rem;cursor:pointer;border:1px solid var(--line)}
.pitem .del{flex:none;width:42px;height:46px;border-radius:calc(var(--r)*.65);border:1px solid var(--line);background:var(--card);color:var(--bad);font-size:1rem;cursor:pointer}
.pitem .del:disabled{opacity:.25}
.sumcard{cursor:pointer;display:flex;flex-direction:column;gap:10px}

/* ---------- Carte secrète ---------- */
.secret{width:100%;perspective:900px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.secret .inner{position:relative;width:100%;height:200px;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.secret.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:calc(var(--r)*1.2);display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:14px;border:1px solid var(--line);text-align:center}
.face.front{background:repeating-linear-gradient(45deg,var(--card) 0 12px,var(--card2) 12px 24px);color:var(--mut);font-weight:800;font-size:1.05rem;cursor:pointer}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,rgba(var(--acc-rgb),.35),rgba(var(--acc2-rgb),.3));align-content:center;gap:6px}
.face.back .w{font-size:clamp(1.9rem,10vw,3rem);font-weight:900;letter-spacing:-1px;word-break:break-word;line-height:1.05}
.face.back .t{font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:2px}

/* ---------- Jeu ---------- */
.spk{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px var(--pad);border-color:rgba(var(--acc-rgb),.5);background:linear-gradient(160deg,rgba(var(--acc-rgb),.18),var(--card))}
.spk.done{border-color:rgba(var(--cc-rgb),.5);background:linear-gradient(160deg,rgba(var(--cc-rgb),.14),var(--card))}
.ring{--p:100;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center;cursor:pointer;transition:.2s}
.ring b{width:80px;height:80px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-variant-numeric:tabular-nums;font-size:1.4rem;font-weight:900}
.ring.low{background:conic-gradient(var(--bad) calc(var(--p)*1%),var(--card2) 0);animation:pulse .6s infinite}
.ring.end{background:var(--bad);animation:pulse .5s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.oc{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:30px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.85rem;transition:.2s}
.oc.now{border-color:var(--acc);background:rgba(var(--acc-rgb),.2);transform:scale(1.06)}
.oc.done{opacity:.45}
.oc.dead{opacity:.3;text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.vote{padding:16px 8px;border-radius:var(--r);background:var(--card);border:2px solid var(--line);text-align:center;cursor:pointer;transition:.15s;color:var(--txt);font:inherit;font-weight:800;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:6px}
.vote:active{transform:scale(.96)}
.vote.sel{border-color:var(--cu);background:rgba(var(--cu-rgb),.18);box-shadow:0 0 0 4px rgba(var(--cu-rgb),.15);transform:scale(1.03)}
.reveal-card{padding:28px 18px;border-radius:calc(var(--r)*1.3);text-align:center;border:2px solid var(--line);animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.reveal-card.c{background:linear-gradient(160deg,rgba(var(--cc-rgb),.22),transparent);border-color:var(--cc)}
.reveal-card.u{background:linear-gradient(160deg,rgba(var(--cu-rgb),.26),transparent);border-color:var(--cu)}
.reveal-card.w{background:linear-gradient(160deg,rgba(var(--cw-rgb),.24),transparent);border-color:var(--cw)}
.emoji{font-size:4rem;display:block;margin-bottom:4px}
.winner{font-size:clamp(1.8rem,9vw,2.8rem);font-weight:900;text-align:center;letter-spacing:-1px;line-height:1.05;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.table{width:100%;border-collapse:collapse}
.table td,.table th{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:.92rem}
.table th{color:var(--mut);font-size:.7rem;text-transform:uppercase;letter-spacing:1px}
.table .r{text-align:right}.pts{font-weight:900;color:var(--warn)}
.pr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border:0}.pr .nm{flex:1;font-weight:700}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- Réglages ---------- */
.set-wrap{position:fixed;inset:0;z-index:70;display:none;background:rgba(5,5,14,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.set-wrap.open{display:flex;justify-content:flex-end;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.set-panel{width:min(540px,100%);height:100%;background:var(--panel);display:flex;flex-direction:column;border-left:1px solid var(--line);animation:slide .3s cubic-bezier(.2,1,.3,1) both}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.set-head{display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 16px 10px;gap:10px}
.set-head b{font-size:1.2rem}
.tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:64px;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;font-size:.72rem;padding:8px 6px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap}
.tab span{font-size:1.25rem}
.tab.on{background:rgba(var(--acc-rgb),.18);color:var(--txt)}
.set-body{flex:1;overflow:auto;padding:14px 14px 30px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.set-foot{padding:10px 14px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.ssec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px 10px}
.ssec h4{font-size:.72rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--mut);padding:10px 0 4px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.col{flex-direction:column;align-items:stretch;gap:8px}
.sl{display:flex;flex-direction:column;gap:2px;min-width:0}
.sl b{font-size:.95rem}.sl span{font-size:.76rem;color:var(--mut);line-height:1.3}
.sc{flex:none;display:flex;align-items:center;gap:8px}
.srow.col .sc{flex:1}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:1.1rem;font-weight:800;cursor:pointer}
.stepper b{min-width:30px;text-align:center;font-size:1.05rem}
.switch{position:relative;width:52px;height:30px;flex:none;display:block}
.switch input{display:none}
.switch span{position:absolute;inset:0;background:var(--card2);border-radius:30px;border:1px solid var(--line);transition:.2s;cursor:pointer}
.switch span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--acc);border-color:var(--acc)}
.switch input:checked+span:after{transform:translateX(22px)}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:3px;gap:3px;flex-wrap:wrap;width:100%}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;font-size:.8rem;padding:8px 8px;border-radius:11px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(var(--acc-rgb),.35)}
.slider{display:flex;align-items:center;gap:10px;width:100%}
.slider input{flex:1;accent-color:var(--acc);height:28px}
.slider span{min-width:44px;text-align:right;font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
input.color{width:46px;height:34px;border:2px solid var(--line);border-radius:10px;background:none;padding:0;cursor:pointer}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.swatch{border:2px solid transparent;border-radius:14px;height:54px;cursor:pointer;color:#fff;font:inherit;font-weight:800;font-size:.72rem;text-shadow:0 1px 4px rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding:5px}
.swatch.on{border-color:var(--txt);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.3)}
.cats{display:flex;flex-wrap:wrap;gap:7px;width:100%}
.chip{padding:8px 13px;border-radius:30px;border:1px solid var(--line);background:var(--card2);font-size:.82rem;cursor:pointer;user-select:none;color:var(--mut);font-weight:700;transition:.15s}
.chip.on{background:rgba(var(--acc-rgb),.25);border-color:var(--acc);color:var(--txt)}
.pairrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.pairrow span{flex:1}.pairrow button{border:0;background:none;color:var(--bad);font-size:1rem;cursor:pointer}
.preview{display:flex;flex-direction:column;gap:12px}

/* ---------- Modales / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(5,5,12,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:90;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--panel);color:var(--txt);border-radius:26px 26px 0 0;border:1px solid var(--line);padding:20px 18px max(24px,env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,1,.3,1) both}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h3{margin-bottom:10px}
.sheet p,.sheet li{color:var(--mut);line-height:1.5;font-size:.92rem}
.sheet p b,.sheet li b{color:var(--txt)}
.sheet ul{padding-left:18px;margin:8px 0}
.egrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 16px}
.egrid button{font-size:1.7rem;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 0;cursor:pointer}
.egrid button:active{transform:scale(.9)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);padding:11px 18px;border-radius:30px;font-weight:800;font-size:.9rem;z-index:120;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:100;width:100%;height:100%}

/* ---------- iOS Liquid Glass ---------- */
:root{--glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.16);--edge:rgba(255,255,255,.26);--gp:rgba(24,24,46,.6);--sh:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),0 12px 32px rgba(0,0,0,.28)}
body.light{--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.82);--edge:rgba(255,255,255,.95);--gp:rgba(255,255,255,.75);--sh:inset 0 1px 0 #fff,0 10px 30px rgba(40,40,100,.14)}
body{font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.card,.iconbtn,.vote,.oc,.ssec,.chip,.tab.on{background:var(--glass);border:1px solid var(--edge);box-shadow:var(--sh);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%)}
.btn{border-radius:999px;border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 10px 28px rgba(var(--acc-rgb),.4);position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;left:8%;right:8%;top:2px;height:45%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.3),transparent);pointer-events:none}
.btn.ghost{background:var(--glass2);color:var(--txt);border-color:var(--edge);box-shadow:var(--sh);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
.btn.sm{border-radius:999px}.iconbtn{border-radius:50%}
.set-panel,.sheet{background:var(--gp);border:1px solid var(--edge);backdrop-filter:blur(44px) saturate(190%);-webkit-backdrop-filter:blur(44px) saturate(190%)}
.sheet{border-radius:34px 34px 0 0}
.seg{border-radius:999px;background:var(--glass)}.seg button{border-radius:999px}
.switch{width:51px;height:31px}.switch span:after{width:27px;height:27px}.switch input:checked+span{background:#34c759;border-color:#34c759}.switch input:checked+span:after{transform:translateX(20px)}
.bg i{filter:blur(60px)}
.stepper button.stepbig{width:54px;height:54px;font-size:1.7rem;border-radius:50%;background:var(--glass2)}
.deck{display:grid;gap:12px;width:100%;grid-template-columns:repeat(3,1fr)}.deck.c4{grid-template-columns:repeat(4,1fr);gap:9px}

vote(){

elim(){
  const p=G.players[G.out],w=wordFor(p);
  if(ui.guessing){
    return `

  const s=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  modal(`<h3>🏆 Classement général</h3>${s.length?`<table class="table"><tr><th>#</th><th>Joueur</th><th class="r">Points</th></tr>
  ${s.map(([n,v],i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(n)}</td><td class="r pts">${v}</td></tr>`).join('')}</table>`:'<p>Aucun score pour l\'instant.</p>'}
  <div style="height:14px"></div><div class="row"><button class="btn ghost" data-act="resetscores">🗑️ Remettre à zéro</button><button class="btn" data-act="closem">Fermer</button></div>`)}
function emojiModal(i){ui.pi=i;modal(`<h3>Choisis un avatar</h3><div class="egrid">${EMO.map(e=>`<button data-act="emo" data-v="${e}">${e}</button>`).join('')}</div><button class="btn ghost" data-act="closem">Annuler</button>`)}

function copy(txt){
  const ok=()=>toast('Copié ✔');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,()=>fb());else fb();
  function fb(){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(e){toast('Copie impossible')}t.remove()}
}
function exportData(){return JSON.stringify({S,P,C,scores},null,1)}

/* ================= ÉVÉNEMENTS ================= */
function peek(open){
  const s=$('#secret');if(!s)return;
  const isOpen=s.classList.contains('open');
  const want=open===undefined?!isOpen:open;
  if(want===isOpen)return;
  s.classList.toggle('open',want);
  clearTimeout(ui.hide);
  if(want){
    sfx.flip();vib(40);ui.revealed=true;
    const b=$('#nextr');if(b){b.disabled=false;b.classList.remove('ghost')}
    const h=$('#rhint');if(h)h.textContent=S.hold?'Relâche pour cacher.':"Mémorise-le, puis cache l'écran.";
    if(!S.hold&&S.autoHide>0)ui.hide=setTimeout(()=>peek(false),S.autoHide*1000);
  }
}
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-hold]'))peek(true)});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{if(S.hold&&screen==='reveal')peek(false)}));

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){setTab=tab.dataset.tab;sfx.tap();renderSettings();return}
  const st=e.target.closest('[data-st]');
  if(st){const k=st.dataset.st,v=Math.min(+st.dataset.max,Math.max(+st.dataset.min,gp(S,k)+ +st.dataset.d));sp(S,k,v);saveAll();sfx.tap();renderSettings();return}
  const sg=e.target.closest('[data-sg]');
  if(sg){const k=sg.dataset.sg;let v=sg.dataset.v;const cur=gp(S,k);
    if(typeof cur==='boolean')v=v==='true';else if(typeof cur==='number')v=+v;
    setVal(k,v);sfx.tap();renderSettings();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  let act=t.dataset.act;const v=t.dataset.v,i=t.dataset.i!==undefined?+t.dataset.i:null;
  let arg=null;if(act.includes(':')){[act,arg]=act.split(':')}
  if(act!=='closem'&&act!=='peek')sfx.tap();
  switch(act){
    case 'home':go('home');break;
    case 'setup':go('setup');break;
    case 'settings':sfx.open();openSettings(arg);break;
    case 'closeset':sfx.close();closeSettings();break;
    case 'rules':sfx.open();rulesModal();break;
    case 'scores':sfx.open();scoresModal();break;
    case 'closem':sfx.close();$('#modal').innerHTML='';break;
    case 'quick':if(checkConfig())go('setup');else newGame();break;
    case 'epick':emojiModal(i);break;
    case 'emo':P[ui.pi].e=v;saveAll();$('#modal').innerHTML='';render();break;
    case 'addp':{if(P.length<20){const used=P.map(p=>p.e);const e=shuffle(EMO).find(x=>!used.includes(x))||EMO[0];P.push({n:'',e});saveAll();render();const l=document.querySelectorAll('#plist input');l[l.length-1].focus()}break}
    case 'delp':if(P.length>3){P.splice(i,1);saveAll();render()}break;
    case 'shufflep':P=shuffle(P);saveAll();render();break;
    case 'start':if(checkConfig())return;saveAll();sfx.deal();newGame();break;
    case 'peek':peek();break;
    case 'pickcard':ui.card=i;ui.rstep='name';sfx.card();vib(30);render();break;
    case 'backpick':ui.card=null;ui.rstep='pick';render();break;
    case 'usename':{const f=$('#nm');if(f){f.value=v;f.focus()}break}
    case 'setname':{
      const f=$('#nm'),nm=f?f.value.trim():'';
      if(!nm){sfx.err();f.classList.add('shake');setTimeout(()=>f.classList.remove('shake'),500);break}
      if(G.players.some(p=>p.name.toLowerCase()===nm.toLowerCase())){sfx.err();toast('Ce prénom est déjà pris');break}
      G.players.push({name:nm,e:G.emo[G.players.length],role:G.slots[ui.card],alive:true,card:ui.card});
      ui.rstep='read';ui.revealed=false;sfx.ok();render();break}
    case 'nextreveal':
      clearTimeout(ui.hide);
      if(G.players.length<G.slots.length){ui.card=null;ui.rstep='pick';render()}
      else{P=G.players.map(p=>({n:p.name,e:p.e}));saveAll();enterPlay();sfx.win()}
      break;
    case 'npd':S.np=Math.min(20,Math.max(3,S.np+ +v));saveAll();render();break;
    case 'mtoggle':S.music=!S.music;saveAll();S.music?musicStart():musicStop();render();toast(S.music?'Musique activée 🎵':'Musique coupée');break;
    case 'nextspk':sfx.vote();
      G.spk++;clearTimer();ui.tt=0;ui.tl=0;render();
      if(G.spk<G.order.length&&S.timer>0)startTimer(S.timer);
      break;
    case 'tpause':
      if(!ui.tt){const s=G.spk<G.order.length?S.timer:S.debate;if(s>0)startTimer(s)}
      else if(ui.tid)clearTimer();
      else if(ui.tl>0)ui.tid=setInterval(tick,1000);
      break;
    case 'tovote':sfx.open();go('vote');break;
    case 'backplay':go('play');break;
    case 'pick':ui.sel=i;sfx.vote();vib(20);render();break;
    case 'eliminate':{
      const o=ui.sel;G.out=o;G.players[o].alive=false;G.hist.push({r:G.round,i:o});
      go('elim');sfx.elim(G.players[o].role);vib([100,50,200]);break}
    case 'afterelim':{
      const p=G.players[G.out];
      if(p.role==='w'&&!ui.guessing){ui.guessing=true;render();break}
      const w=checkWin();if(w)finish(w);else{G.round++;enterPlay()}
      break}
    case 'guess':{
      const g=$('#guess'),val=g?g.value:'';
      if(!val.trim()){g.classList.add('shake');setTimeout(()=>g.classList.remove('shake'),500);return}
      if(norm(val)===norm(G.civil))finish('white');
      else{sfx.lose();toast('Raté ! Ce n\'était pas ça…');ui.guessing=false;const w=checkWin();if(w)finish(w);else{G.round++;enterPlay()}}
      break}
    case 'again':sfx.deal();newGame();break;
    case 'share':{
      const w=G.winner,win={civils:`Les ${rn('c')}s gagnent`,infiltres:'Les infiltrés gagnent',white:`${rn('w')} a deviné le mot`}[w];
      copy(`🕵️ Undercover — ${win} !\n${rn('c')} : ${G.civil} · ${rn('u')} : ${G.und}\n`+G.players.map(p=>`${p.e} ${p.name} — ${rn(p.role)}`).join('\n'));break}
    /* réglages */
    case 'auto':{const r=recommended(S.np);S.und=r.und;S.white=r.white;saveAll();renderSettings();break}
    case 'preset':{const p=PRESETS.find(x=>x.id===v);S.theme=p.id;S.acc=p.a;S.acc2=p.b;if(p.id==='glace')S.mode='light';else if(S.mode==='light'&&p.id!=='glace')S.mode='dark';saveAll();applyTheme();renderSettings();break}
    case 'randtheme':{const h=Math.random()*360;const hsl=(h,s,l)=>{l/=100;const a=s*Math.min(l,1-l)/100;const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,'0')};return`#${f(0)}${f(8)}${f(4)}`};
      S.theme='custom';S.acc=hsl(h,85,62);S.acc2=hsl((h+60+Math.random()*80)%360,85,62);saveAll();applyTheme();renderSettings();break}
    case 'cat':{const k=S.cats.indexOf(v);k>=0?S.cats.splice(k,1):S.cats.push(v);saveAll();renderSettings();break}
    case 'catall':S.cats=[...CATS];saveAll();renderSettings();break;
    case 'catnone':S.cats=[];saveAll();renderSettings();break;
    case 'addpair':{
      const a=$('#pa').value.trim(),b=$('#pb').value.trim();
      if(!a||!b||a.toLowerCase()===b.toLowerCase()){toast('Deux mots différents requis');break}
      C.push({a,b});saveAll();renderSettings();toast('Paire ajoutée ✔');break}
    case 'delpair':C.splice(i,1);saveAll();renderSettings();break;
    case 'bulk':{
      const lines=($('#bulk').value||'').split('\n');let n=0;
      lines.forEach(l=>{const m=l.split(/[;|,\t]|\s-\s/).map(x=>x.trim()).filter(Boolean);if(m.length>=2&&C.length<500&&!C.some(c=>c.a===m[0]&&c.b===m[1])){C.push({a:m[0],b:m[1]});n++}});
      saveAll();renderSettings();toast(n+' paire'+(n>1?'s':'')+' importée'+(n>1?'s':''));break}
    case 'clearused':store.set('used',[]);toast('Historique vidé ✔');break;
    case 'testsound':sfx.win();vib(60);break;
    case 'expcopy':copy(exportData());break;
    case 'expfile':{const b=new Blob([exportData()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='undercover-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);break}
    case 'impdo':{
      try{const d=JSON.parse($('#imp').value);
        if(d.S)S=deepMerge(DEF,d.S);if(Array.isArray(d.P)&&d.P.length>=3)P=d.P.map(p=>({n:String(p.n||''),e:p.e||'🦊'}));
        if(Array.isArray(d.C))C=d.C.filter(c=>c&&c.a&&c.b);if(d.scores&&typeof d.scores==='object')scores=d.scores;
        saveAll();applyTheme();renderSettings();toast('Import réussi ✔')}catch(err){toast('JSON invalide')}break}
    case 'resetscores':if(confirm('Remettre tous les scores à zéro ?')){scores={};saveAll();$('#modal').innerHTML='';if($('#settings').classList.contains('open'))renderSettings();toast('Scores effacés')}break;
    case 'resetS':if(confirm('Remettre les réglages par défaut ?')){S=deepMerge(DEF,{});saveAll();applyTheme();renderSettings()}break;
    case 'resetall':if(confirm('Tout effacer (joueurs, paires, scores, réglages) ?')){try{Object.keys(localStorage).filter(k=>k.startsWith(KEY)).forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}break;
  }
});
/* sliders, couleurs, textes, interrupteurs */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pi!==undefined){
    P[+t.dataset.pi].n=t.value;saveAll();
    const err=checkConfig();const el=$('#err');if(el)el.textContent=err;
    const b=document.querySelector('[data-act="start"]');if(b)b.disabled=!!err;
    const ic=t.closest('.pitem').querySelector('.av');if(ic&&S.avatars==='initials')ic.outerHTML=av(P[+t.dataset.pi].e,t.value);
    return;
  }
  const k=t.dataset.k;if(!k)return;
  if(t.type==='range'){setVal(k,+t.value);const l=$('#v_'+k.replace('.','_'));if(l)l.textContent=t.value+(t.dataset.u||'')}
  else if(t.type==='color')setVal(k,t.value);
  else if(t.type==='text'){sp(S,k,t.value);saveAll()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.type==='checkbox'&&t.dataset.k){setVal(t.dataset.k,t.checked);sfx.toggle();renderSettings()}
  if(t.type==='range'||t.type==='color')saveAll();
});
const PRS='.btn,.vote,.iconbtn,.chip,.tab,.seg button,.stepper button,.sumcard,.pc:not(.taken),.egrid button,.swatch,.switch';
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest&&e.target.closest(PRS);if(!el)return;
  sfx.press();vib(8);if(el.classList.contains('switch'))return;
  const r=el.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,sp=document.createElement('span');sp.className='rip';
  sp.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;
  el.appendChild(sp);setTimeout(()=>sp.remove(),700)},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').innerHTML)$('#modal').innerHTML='';else if($('#settings').classList.contains('open'))closeSettings()}
  if(e.key==='Enter'){
    if(e.target.id==='guess')document.querySelector('[data-act="guess"]').click();
    if(e.target.id==='nm')document.querySelector('[data-act="setname"]').click();
    if(e.target.dataset.pi!==undefined){const l=[...document.querySelectorAll('#plist input')],k=l.indexOf(e.target);if(l[k+1])l[k+1].focus();else if(P.length<20)document.querySelector('[data-act="addp"]').click()}
  }
});
addEventListener('beforeunload',e=>{if(G&&G.winner===null&&screen!=='home'){e.preventDefault();e.returnValue=''}});

applyTheme();
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
